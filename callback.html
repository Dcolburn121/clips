<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected – Daily Clipz</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Almost done</h1>
<p>Copy this whole address and paste it into the Daily Clipz window on your computer:</p>
<p><textarea id="u" readonly style="width:100%;height:110px;font-size:14px"></textarea></p>
<p><button id="c" style="padding:10px 18px;font-size:16px">Copy</button> <span id="m" class="muted"></span></p>
<p class="muted">This page doesn't send or store anything. It only shows the address TikTok sent you back to.</p>
<script>
  // Daily Clipz console started this sign-in: state ends in ~PORT -> hand the code straight back to it.
  (function () {
    var q = new URLSearchParams(location.search), st = q.get('state') || '', i = st.lastIndexOf('~');
    if (i > 0 && /^\d{2,5}$/.test(st.slice(i + 1))) {
      document.querySelector('h1').textContent = 'Returning to Daily Clipz…';
      location.replace('http://127.0.0.1:' + st.slice(i + 1) + '/auth/tiktok/callback' + location.search);
    }
  })();
  var u = document.getElementById('u');
  u.value = location.href;
  if (location.search.indexOf('error') !== -1) { document.querySelector('h1').textContent = 'Sign-in was cancelled or failed'; }
  document.getElementById('c').onclick = function () {
    u.select();
    try { navigator.clipboard.writeText(u.value); } catch (e) { document.execCommand('copy'); }
    document.getElementById('m').textContent = 'Copied!';
  };
</script>
<footer>© 2026 Daily Clipz</footer></body></html>
